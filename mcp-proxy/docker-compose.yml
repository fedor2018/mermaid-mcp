services:
  mermaid-mcp-proxy:
    image: mermaid-mcp-stdio-proxy:latest
    container_name: mermaid-mcp-proxy
    hostname: mermaid-mcp-proxy
    build:
      # The dockerfile lives in mcp-proxy/, but the context is the repo root:
      # package.json, package-lock.json and src/ are copied from there.
      context: ..
      dockerfile: mcp-proxy/Dockerfile
    # The config uses a relative path (src/stdio-server.mjs) — the spawned
    # child inherits the proxy's working directory, so it must be the repo.
    working_dir: /app/mermaid
    mem_limit: 1024m
    mem_reservation: 128m
    cpus: 1
    ports:
      - "8097:8080"
    volumes:
      # Named-server config (config/servers.json) — proxy.sh refreshes it from
      # GitHub before every start.
      - ./config:/config:rw
      - ./cache:/app/cache
      # Auto-install hooks (init.d) — editable without rebuilding the image.
      - ./init.d:/docker-entrypoint-init.d:ro
    command:
      - --debug
      - --pass-environment
      - --port=8080
      - --host=0.0.0.0
      - --stateless
      - --named-server-config=/config/servers.json
    restart: unless-stopped
    networks:
      - puma-net

networks:
  puma-net:
    external: true
